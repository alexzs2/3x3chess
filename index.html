    // ========================================================
    // CONFIGURAÇÃO MESTRE DO GOOGLE ADSENSE E PUBLICIDADE PRÓPRIA
    // ========================================================
    const ADSENSE_CONFIG = {
      enabled: false, 
      clientId: "ca-pub-0000000000000000",
      slots: {
        topBanner: "1111111111",
        rightSquare1: "2222222222",
        rightSquare2: "3333333333",
        footerBanner: "4444444444"
      }

    const STORAGE_KEY = '3x3chess_studio_prefs_v1';
    const WELCOMED_KEY = '3x3chess_welcomed_v1';

    const loadSavedPrefs = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    };

    const savePrefsToStorage = (prefs) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
      } catch (e) {}
    };

    // Detecta automaticamente o idioma do país/navegador do visitante na 1ª visita.
    // Se não for PT, ES, FR, DE ou RU, inicia sempre em Inglês ('EN') como padrão!
    const detectBrowserLanguage = () => {
      try {
        const langs = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
        for (const l of langs) {
          if (!l) continue;
          const short = l.toLowerCase().substring(0, 2);
          if (short === 'pt') return 'PT';
          if (short === 'es') return 'ES';
          if (short === 'fr') return 'FR';
          if (short === 'de') return 'DE';
          if (short === 'ru') return 'RU';
          if (short === 'en') return 'EN';
        }
      } catch (e) {}
      return 'EN';
    };

    // ========================================================
    // MOTOR DE SOM ACÚSTICO (WEB AUDIO API)
    // ========================================================
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) sharedAudioCtx = new AudioContext();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    };

    const playGameSound = (type, enabled, volumePct) => {
      if (!enabled || volumePct <= 0) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const vol = (volumePct / 100) * 0.45;
      const now = ctx.currentTime;

      if (type === 'select') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.045);
        gain.gain.setValueAtTime(vol * 0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'move') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.075);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'capture') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.12);
        gain.gain.setValueAtTime(vol * 1.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'check') {
        [587.33, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(vol * 0.7, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.17);
        });
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = now + idx * 0.09;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(vol * 0.85, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.4);
        });
      }
    };

    // 1. Validação Geométrica
    const isPseudoLegalMove = (boardState, piece, startR, startC, endR, endC) => {
      if (!piece) return false;
      if (startR === endR && startC === endC) return false;
      const rDiff = endR - startR;
      const cDiff = endC - startC;
      const absR = Math.abs(rDiff);
      const absC = Math.abs(cDiff);
      const target = boardState[endR][endC];
      
      if (target && target.color === piece.color) return false;

      const isPathClear = (dr, dc) => {
          let r = startR + dr; let c = startC + dc;
          while (r !== endR || c !== endC) {
              if (boardState[r][c] !== null) return false;
              r += dr; c += dc;
          }
          return true;
      };

      switch(piece.type) {
          case 'k': return absR <= 1 && absC <= 1;
          case 'n': return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
          case 'r': 
              if (startR !== endR && startC !== endC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'b':
              if (absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'q':
              if (startR !== endR && startC !== endC && absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'p':
              const dir = piece.color === 'w' ? -1 : 1;
              if (cDiff === 0 && rDiff === dir && !target) return true; 
              if (absC === 1 && rDiff === dir && target) return true; 
              return false;
          default: return false;
      }
    };

    // 2. Verifica se o Rei está em Xeque
    const isKingInCheck = (boardState, kingColor) => {
      let kingR = -1, kingC = -1;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === kingColor && p.type === 'k') {
            kingR = r; kingC = c;
            break;
          }
        }
      }
      if (kingR === -1) return true;

      const enemyColor = kingColor === 'w' ? 'b' : 'w';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === enemyColor) {
            if (isPseudoLegalMove(boardState, p, r, c, kingR, kingC)) {
              return true;
            }
          }
        }
      }
      return false;
    };

    // 3. Simula um movimento e retorna o novo tabuleiro
    const simulateMoveOnBoard = (boardState, startR, startC, endR, endC) => {
      const nextBoard = boardState.map(row => [...row]);
      let movingPiece = { ...nextBoard[startR][startC] };
      if (movingPiece.type === 'p') {
        if (movingPiece.color === 'w' && endR === 0) movingPiece.type = 'q';
        if (movingPiece.color === 'b' && endR === 2) movingPiece.type = 'q';
      }
      nextBoard[endR][endC] = movingPiece;
      nextBoard[startR][startC] = null;
      return nextBoard;
    };

    // 4. Validação Completa de Xadrez
    const isMoveLegal = (boardState, piece, startR, startC, endR, endC) => {
      if (!isPseudoLegalMove(boardState, piece, startR, startC, endR, endC)) return false;
      const simulatedBoard = simulateMoveOnBoard(boardState, startR, startC, endR, endC);
      return !isKingInCheck(simulatedBoard, piece.color);
    };

    // 5. Retorna todos os movimentos legais possíveis para um jogador
    const getAllLegalMovesForPlayer = (boardState, color) => {
      const allMoves = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === color) {
            for (let er = 0; er < 3; er++) {
              for (let ec = 0; ec < 3; ec++) {
                if (isMoveLegal(boardState, p, r, c, er, ec)) {
                  allMoves.push({ startR: r, startC: c, endR: er, endC: ec });
                }
              }
            }
          }
        }
      }
      return allMoves;
    };

            const levelStr = selectedLevel.toString().padStart(2, '0');
            const res = await fetch(`./puzzles/matein${levelStr}.json`);
            
            if(res.ok) {
              const data = await res.json();
              const whiteOnlyPuzzles = Array.isArray(data) 
                ? data.filter(fen => typeof fen === 'string' && fen.trim().length === 10 && fen.trim().startsWith('w')).map(f => f.trim())
                : [];
              
              if (whiteOnlyPuzzles.length > 0) {
                setPuzzleDatabase(whiteOnlyPuzzles);
                loadRandomPuzzle(whiteOnlyPuzzles);
              } else {
                throw new Error("No valid White-to-move ('w') puzzles found in JSON.");
              }
            } else {
              throw new Error(`File matein${levelStr}.json not found`);
            }
          } catch (e) {
            console.warn(`Fallback to demo puzzles. Level ${selectedLevel}:`, e);
            const demoDB = ["wK.k..NqRn", "w..k.r.K..", "w..r.K..q."];
            setPuzzleDatabase(demoDB);
            loadRandomPuzzle(demoDB);
          }
        };
        fetchPuzzles();
      }, [selectedLevel]);

      // Pausa a contagem do cronômetro enquanto a Splash Screen estiver aberta
      useEffect(() => {
        let interval = null;
        if (timerRunning && !isWon && !showSplashModal) {
          interval = setInterval(() => { setSeconds(prev => prev + 1); }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [timerRunning, isWon, showSplashModal]);

      useEffect(() => {
        if (isWon && window.confetti) {
          window.confetti({ particleCount: 140, spread: 90, origin: { y: 0.55 }, colors: ['#F59E0B', '#10B981', '#3B82F6', '#EF4444', '#FFF3D4'] });
        }
      }, [isWon]);

      // Inteligência Artificial das Pretas
      useEffect(() => {
        if (currentTurn === 'b' && !isWon && timerRunning) {
          setIsComputerThinking(true);
          const timer = setTimeout(() => {
            const legalMoves = getAllLegalMovesForPlayer(board, 'b');
            
            if (legalMoves.length > 0) {
              let safeMoves = legalMoves.filter(m => {
                const nextB = simulateMoveOnBoard(board, m.startR, m.startC, m.endR, m.endC);
                const whiteMoves = getAllLegalMovesForPlayer(nextB, 'w');
                const canWhiteMateNext = whiteMoves.some(wm => {
                  const afterWhiteB = simulateMoveOnBoard(nextB, wm.startR, wm.startC, wm.endR, wm.endC);
                  return isKingInCheck(afterWhiteB, 'b') && getAllLegalMovesForPlayer(afterWhiteB, 'b').length === 0;
                });
                return !canWhiteMateNext;
              });

              const pool = safeMoves.length > 0 ? safeMoves : legalMoves;
              const chosenMove = pool[Math.floor(Math.random() * pool.length)];
              executeMove(chosenMove.startR, chosenMove.startC, chosenMove.endR, chosenMove.endC);
            } else {
              if (isKingInCheck(board, 'b')) {
                playGameSound('win', soundEnabled, soundVolume);
                setIsWon(true);
                setTimerRunning(false);
              } else {
                setShowHint(true);
                setHintDetails(t.msgStalemate);
                setTimerRunning(false);
              }
            }
            setIsComputerThinking(false);
          }, 550);
          return () => clearTimeout(timer);
        }
      }, [currentTurn, board, isWon, timerRunning, language]);

      const loadRandomPuzzle = (db = puzzleDatabase) => {
        if(db.length === 0) return;
        const fen = db[Math.floor(Math.random() * db.length)];
        setCurrentFen(fen);
        parseFenToBoard(fen);
      };

      const parseFenToBoard = (fen) => {
        const boardStr = fen.substring(1);
        const newBoard = [[null,null,null], [null,null,null], [null,null,null]];
        let idx = 0;
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const char = boardStr[idx++];
            if (char !== '.') {
              newBoard[r][c] = { color: char === char.toUpperCase() ? 'w' : 'b', type: char.toLowerCase() };
            }
          }
        }
        setBoard(newBoard);
        setCurrentTurn('w');
        setSelectedSquare(null);
        setValidMoves([]);
        setSeconds(0);
        setTimerRunning(true);
        setIsWon(false);
        setShowHint(false);
        setIsComputerThinking(false);
      };

      const handleRestart = () => {
        playGameSound('select', soundEnabled, soundVolume);
        if(currentFen) parseFenToBoard(currentFen);
      };

      // Salva estado e recarrega a página para contabilizar novo Pageview de AdSense
      const handleAnotherChallengeReload = () => {
        try { localStorage.setItem(WELCOMED_KEY, 'true'); } catch (e) {}
        savePrefsToStorage({
          selectedLevel,
          language,
          soundEnabled,
          soundVolume,
          hapticsEnabled,
          showTimerUI,
          showMovesUI,
          rotateBoardUI
        });
        window.location.reload();
      };

      const handleNewGame = () => {
        playGameSound('select', soundEnabled, soundVolume);
        handleAnotherChallengeReload();
      };

      const handleLanguageChange = (newLang) => {
        playGameSound('select', soundEnabled, soundVolume);
        setLanguage(newLang);
        if (!showSplashModal) {
          loadRandomPuzzle();
        }
      };

      const getLegalTargetsForPiece = (r, c, piece) => {
        const moves = [];
        for (let tr = 0; tr < 3; tr++) {
          for (let tc = 0; tc < 3; tc++) {
            if (isMoveLegal(board, piece, r, c, tr, tc)) moves.push([tr, tc]);
          }
        }
        return moves;
      };

      const executeMove = (startR, startC, endR, endC) => {
        const movingPiece = board[startR][startC];
        const targetPiece = board[endR][endC];
        const newBoard = simulateMoveOnBoard(board, startR, startC, endR, endC);

        setBoard(newBoard);
        setSelectedSquare(null);
        setValidMoves([]);
        setShowHint(false);
        triggerHaptic(hapticsEnabled, 20);

        const nextTurn = movingPiece.color === 'w' ? 'b' : 'w';
        const opponentLegalMoves = getAllLegalMovesForPlayer(newBoard, nextTurn);
        const opponentInCheck = isKingInCheck(newBoard, nextTurn);

        if (opponentLegalMoves.length === 0) {
          if (opponentInCheck) {
            if (movingPiece.color === 'w') {
              playGameSound('win', soundEnabled, soundVolume);
              triggerHaptic(hapticsEnabled, [40, 60, 80]);
              setIsWon(true);
              setTimerRunning(false);
            } else {
              playGameSound('check', soundEnabled, soundVolume);
              setShowHint(true);
              setHintDetails(t.msgComputerWon);
              setTimerRunning(false);
            }
          } else {
            playGameSound('move', soundEnabled, soundVolume);
            setShowHint(true);
            setHintDetails(t.msgStalemate);
            setTimerRunning(false);
          }
          return;
        }

        if (opponentInCheck) {
          playGameSound('check', soundEnabled, soundVolume);
        } else if (targetPiece) {
          playGameSound('capture', soundEnabled, soundVolume);
        } else {
          playGameSound('move', soundEnabled, soundVolume);
        }

        setCurrentTurn(nextTurn);
      };

      const handleSquareClick = (r, c) => {
        if (isWon || currentTurn !== 'w' || isComputerThinking || !timerRunning) return;
        const piece = board[r][c];

        if (selectedSquare && selectedSquare[0] === r && selectedSquare[1] === c) {
          setSelectedSquare(null);
          setValidMoves([]);
          return;
        }

        if (selectedSquare) {
          const [fromR, fromC] = selectedSquare;
          const movingPiece = board[fromR][fromC];

          if (isMoveLegal(board, movingPiece, fromR, fromC, r, c)) {
            executeMove(fromR, fromC, r, c);
            return;
          } else {
            if (piece && piece.color === 'w') {
              playGameSound('select', soundEnabled, soundVolume);
              const targets = getLegalTargetsForPiece(r, c, piece);
              setSelectedSquare([r, c]);
              setValidMoves(targets);
              if (piece.type === 'p' && targets.length === 0) {
                setShowHint(true);
                setHintDetails(t.hintBlockedPawn);
              }
            } else {
              setSelectedSquare(null);
              setValidMoves([]);
            }
          }
        } else {
          if (piece && piece.color === 'w') {
            playGameSound('select', soundEnabled, soundVolume);
            const targets = getLegalTargetsForPiece(r, c, piece);
            setSelectedSquare([r, c]);
            setValidMoves(targets);
            if (piece.type === 'p' && targets.length === 0) {
              setShowHint(true);
              setHintDetails(t.hintBlockedPawn);
            }
          }
        }
      };

      const handleHint = () => {
        playGameSound('select', soundEnabled, soundVolume);
        const whiteMoves = getAllLegalMovesForPlayer(board, 'w');
        for (const m of whiteMoves) {
          const simBoard = simulateMoveOnBoard(board, m.startR, m.startC, m.endR, m.endC);
          if (isKingInCheck(simBoard, 'b') && getAllLegalMovesForPlayer(simBoard, 'b').length === 0) {
            const fromSq = `${String.fromCharCode(97 + m.startC)}${3 - m.startR}`;
            const toSq = `${String.fromCharCode(97 + m.endC)}${3 - m.endR}`;
            setSelectedSquare([m.startR, m.startC]);
            setValidMoves([[m.endR, m.endC]]);
            setShowHint(true);
            setHintDetails(t.hintWinningMove(fromSq, toSq));
            return;
          }
        }

        if (whiteMoves.length > 0) {
          const sample = whiteMoves[0];
          const piece = board[sample.startR][sample.startC];
          setSelectedSquare([sample.startR, sample.startC]);
          setValidMoves(getLegalTargetsForPiece(sample.startR, sample.startC, piece));
          setShowHint(true);
          setHintDetails(t.hintGeneral);
        }
      };

      const formatTime = (totalSec) => {
        const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const whiteInCheck = isKingInCheck(board, 'w');
      const blackInCheck = isKingInCheck(board, 'b');
      const selectedPieceObj = selectedSquare ? board[selectedSquare[0]][selectedSquare[1]] : null;
      const selectedSqStr = selectedSquare ? `${String.fromCharCode(97 + selectedSquare[1])}${3 - selectedSquare[0]}` : '';

      const displayCols = rotateBoardUI ? [2, 1, 0] : [0, 1, 2];

      return (

                <div

                >
                  {/* VERSÃO CELULAR (Compacta 320x50) */}
                  <div className="flex md:hidden items-center justify-between px-3 py-1.5 gap-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="bg-amber-500 text-amber-950 text-[9px] font-black px-1.5 py-0.5 rounded uppercase shrink-0">
                        Ad
                      </span>
                      <span className="text-xs font-fredoka font-bold text-amber-100 truncate">
                        🪵 {t.merchTitle}
                      </span>
                    </div>
                    <span className="bg-amber-500 text-amber-950 font-fredoka font-black text-[11px] px-2.5 py-1 rounded-lg shrink-0 shadow">
                      {t.shopBtn} ➔
                    </span>
                  </div>

                  {/* VERSÃO PC & TABLET (Leaderboard Clássico 728x90) */}
                  <div className="hidden md:flex min-h-[72px] max-h-[88px] px-5 py-2.5 flex-row items-center justify-between text-left relative">
                    <div className="absolute right-8 -bottom-6 text-6xl opacity-5 pointer-events-none font-serif">♚</div>
                    <div className="flex items-center gap-3.5 z-10">
                      <div className="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-xl shrink-0">
                        🪵
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="bg-amber-500 text-amber-950 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow">3x3Chess Official</span>
                          <h2 className="text-base lg:text-lg font-fredoka font-bold text-amber-100 group-hover:text-amber-200 transition-colors">{t.merchTitle}</h2>
                        </div>
                        <p className="text-xs text-amber-300/80 font-medium">{t.merchSubtitle}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3 z-10 shrink-0">
                      <span className="text-[10px] text-amber-400/60 font-semibold hidden lg:inline">Sponsored • 728x90</span>
                      <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-amber-950 font-fredoka font-black text-xs lg:text-sm px-4 py-2 rounded-xl shadow-md group-hover:scale-105 transition-all flex items-center gap-1.5">
                        <span>{t.shopBtn}</span>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                      </div>
                    </div>
                  </div>
                </div>
              </AdSlot>
            </div>
          </header>

          {/* MAIN NAVIGATION BAR */}
          <nav className="wood-texture border-b-4 border-[#331707] shadow-xl px-4 py-2.5 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setShowSplashModal(true)}>
                <div className="w-11 h-11 bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 rounded-xl border-2 border-[#2b1203] shadow-md flex items-center justify-center relative">
                  <span className="text-2xl drop-shadow select-none">👑</span>
                  <span className="absolute -bottom-1 -right-1 text-[11px] bg-amber-950 text-amber-300 border border-amber-600 rounded-full px-1 font-bold">♞</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-fredoka text-2xl sm:text-3xl font-black tracking-tight text-amber-100 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">3x3<span className="text-amber-400">Chess</span></h1>
                    <span className="bg-amber-600/90 text-white font-fredoka text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow">Studio</span>
                  </div>
                  <p className="text-[11px] text-amber-300/80 font-medium">{t.studioSubtitle}</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2 sm:gap-2.5">
                <div className="flex items-center gap-2 bg-[#241104]/90 border-2 border-[#4b260c] rounded-2xl p-1.5 px-2.5 shadow-inner">
                  
                  {showTimerUI && (
                    <div className="flex items-center gap-2 px-2.5 py-1 bg-[#1a0b02] rounded-xl border border-amber-900/80">
                      <span className={`w-2.5 h-2.5 rounded-full ${timerRunning && !showSplashModal ? 'bg-emerald-400 animate-pulse' : 'bg-red-500'}`}></span>
                      <div className="flex flex-col">
                        <span className="text-[10px] uppercase font-bold text-amber-400/70 tracking-wider">{t.timer}</span>
                        <span className="font-mono font-black text-base sm:text-lg text-emerald-300 tracking-wider leading-none">{formatTime(seconds)}</span>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center gap-1.5 pl-1">
                    <span className="text-xs font-bold text-amber-300/90 hidden sm:inline">{t.difficulty}</span>
                    <select 
                      value={selectedLevel}
                      onChange={(e) => { playGameSound('select', soundEnabled, soundVolume); setSelectedLevel(Number(e.target.value)); }}
                      className="bg-[#1b0d03] text-amber-200 border-2 border-amber-600/60 rounded-xl text-xs sm:text-sm font-bold py-1.5 px-2.5 sm:px-3 cursor-pointer focus:outline-none focus:border-amber-400 hover:border-amber-400 transition-colors shadow-sm"
                    >
                      {[...Array(15)].map((_, i) => (
                        <option key={i + 1} value={i + 1}>
                          {t.mateIn(i + 1)}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <button onClick={() => { playGameSound('select', soundEnabled, soundVolume); setShowProTipModal(true); }} className="btn-chunky btn-chunky-amber bg-gradient-to-b from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-amber-950 font-fredoka font-bold text-xs sm:text-sm py-2 px-3 rounded-xl border-2 border-amber-950 shadow-chunky-btn-amber flex items-center gap-1.5 cursor-pointer">
                  <span className="text-base leading-none">💡</span>
                  <span className="tracking-wide hidden sm:inline">{t.proTipBtn}</span>
                </button>

                {/* BOTÃO PARA REABRIR A SPLASH SCREEN DE BOAS-VINDAS */}
                <button
                  onClick={() => { playGameSound('select', soundEnabled, soundVolume); setShowSplashModal(true); }}

                {/* BOTÃO DE CONFIGURAÇÕES (SETTINGS ⚙️) */}
                <button

                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>

                <select value={language} onChange={(e) => handleLanguageChange(e.target.value)} className="bg-[#241104] text-amber-100 font-bold text-xs py-2 px-2.5 rounded-xl border-2 border-amber-800/80 hover:border-amber-500 focus:outline-none cursor-pointer uppercase tracking-wider">
                  <option value="EN">🇺🇸 EN</option>
                  <option value="PT">🇧🇷 PT</option>
                  <option value="ES">🇪🇸 ES</option>
                  <option value="FR">🇫🇷 FR</option>
                  <option value="DE">🇩🇪 DE</option>
                  <option value="RU">🇷🇺 RU</option>
                </select>
              </div>
            </div>
          </nav>

          {/* STUDIO WORKSPACE */}
          <div className="flex-1 max-w-[1500px] w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <main className="lg:col-span-8 xl:col-span-9 flex flex-col items-center">
              
              <div className="w-full max-w-xl flex items-center justify-between bg-black/35 border border-amber-900/50 backdrop-blur-md rounded-2xl px-4 py-2 mb-3 shadow">
                <div className="flex items-center gap-2.5">
                  <div className="w-7 h-7 rounded-full bg-amber-500/20 border border-amber-400 flex items-center justify-center font-bold text-amber-300 text-xs">⚡</div>
                  <div>
                    <div className="text-[11px] uppercase font-extrabold text-amber-400 tracking-wider">{t.mateIn(selectedLevel)}</div>
                    <div className="text-xs sm:text-sm font-semibold text-amber-100/90">{t.whiteToMove}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2 bg-amber-950/80 border border-amber-700/50 px-2.5 py-1 rounded-xl">
                  <span className={`w-2.5 h-2.5 rounded-full border border-amber-950 shadow ${currentTurn === 'w' ? 'bg-white' : 'bg-black'}`}></span>
                  <span className="text-xs font-bold text-amber-200">
                    {currentTurn === 'w' ? t.whitesTurn : t.computerThinking}
                    {(whiteInCheck || blackInCheck) && !isWon ? t.checkAlert : ""}
                  </span>
                </div>
              </div>

              {showHint && (
                <div className="w-full max-w-xl mb-3 bg-amber-900/90 border-2 border-amber-500 rounded-2xl p-3 flex items-start justify-between gap-3 shadow-lg">
                  <div className="flex items-start gap-2">
                    <span className="text-lg">💡</span>
                    <p className="text-xs sm:text-sm font-medium text-amber-100 leading-snug">
                      <strong className="text-amber-300 font-bold">{t.noticeLabel} </strong> {hintDetails}
                    </p>
                  </div>
                  <button onClick={() => setShowHint(false)} className="text-amber-300 hover:text-white p-1 rounded-lg">✕</button>
                </div>
              )}

              {/* CHESS BOARD (OTIMIZADO PARA CELULAR, TABLET E PC) */}
              <div className="w-full flex flex-col items-center justify-center my-1">
                <div className="w-full max-w-[88vw] sm:max-w-[450px] md:max-w-[460px] lg:max-w-[465px] aspect-square relative touch-manipulation">
                  <div className="w-full h-full p-4 sm:p-5 wood-texture rounded-3xl sm:rounded-[36px] border-4 sm:border-[6px] border-[#291002] shadow-chunky-wood flex flex-col relative">
                    <div className="absolute top-2.5 left-2.5 w-3 h-3 rounded-full bg-amber-950 border border-amber-600/50 shadow-inner"></div>
                    <div className="absolute top-2.5 right-2.5 w-3 h-3 rounded-full bg-amber-950 border border-amber-600/50 shadow-inner"></div>
                    <div className="absolute bottom-2.5 left-2.5 w-3 h-3 rounded-full bg-amber-950 border border-amber-600/50 shadow-inner"></div>
                    <div className="absolute bottom-2.5 right-2.5 w-3 h-3 rounded-full bg-amber-950 border border-amber-600/50 shadow-inner"></div>

                    <div className="w-full h-full grid grid-cols-3 grid-rows-3 gap-1 sm:gap-1.5 p-1 bg-[#371603] rounded-2xl sm:rounded-[26px] border-2 border-[#1f0b01] shadow-inner-board overflow-hidden">
                      {displayRows.map((rIdx) => 
                        displayCols.map((cIdx) => {
                          const cell = board[rIdx][cIdx];
                          const isLight = (rIdx + cIdx) % 2 === 0;
                          const isSelected = selectedSquare && selectedSquare[0] === rIdx && selectedSquare[1] === cIdx;
                          const isValidTarget = showMovesUI && validMoves.some(([mr, mc]) => mr === rIdx && mc === cIdx);

                      </button>
                    </div>

                    <div className="px-6 py-2 divide-y divide-[#2e313a]">
                      
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-sm text-white leading-tight">{t.soundsTitle}</div>
                          <div className="text-[11px] text-gray-400">{t.soundsDesc}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            const next = !soundEnabled;
                            setSoundEnabled(next);
                            if (next) playGameSound('move', true, soundVolume);
                          }}
                          className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${soundEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}
                        >
                          <span className="w-5 h-5 rounded-full bg-white shadow-md block"></span>
                        </button>
                      </div>

                      <div className="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-sm text-white leading-tight">{t.hapticsTitle}</div>
                          <div className="text-[11px] text-gray-400">{t.hapticsDesc}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            const next = !hapticsEnabled;
                            setHapticsEnabled(next);
                            if (next) triggerHaptic(true, 30);
                            playGameSound('select', soundEnabled, soundVolume);
                          }}
                          className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${hapticsEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}
                        >
                          <span className="w-5 h-5 rounded-full bg-white shadow-md block"></span>
                        </button>
                      </div>

                      <div className="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-sm text-white leading-tight">{t.showTimerTitle}</div>
                          <div className="text-[11px] text-gray-400">{t.showTimerDesc}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            setShowTimerUI(!showTimerUI);
                            playGameSound('select', soundEnabled, soundVolume);
                          }}
                          className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showTimerUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}
                        >
                          <span className="w-5 h-5 rounded-full bg-white shadow-md block"></span>
                        </button>
                      </div>

                      <div className="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-sm text-white leading-tight">{t.showMovesTitle}</div>
                          <div className="text-[11px] text-gray-400">{t.showMovesDesc}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            setShowMovesUI(!showMovesUI);
                            playGameSound('select', soundEnabled, soundVolume);
                          }}
                          className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showMovesUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}
                        >
                          <span className="w-5 h-5 rounded-full bg-white shadow-md block"></span>
                        </button>
                      </div>

                      <div className="py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-bold text-sm text-white leading-tight">{t.rotateBoardTitle}</div>
                          <div className="text-[11px] text-gray-400">{t.rotateBoardDesc}</div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            setRotateBoardUI(!rotateBoardUI);
                            playGameSound('select', soundEnabled, soundVolume);
                          }}
                          className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${rotateBoardUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}
                        >
                          <span className="w-5 h-5 rounded-full bg-white shadow-md block"></span>
                        </button>
                      </div>

                    </div>
                  </div>

                  <div className="px-6 py-3 border-t border-[#2e313a] text-center text-[11px] text-gray-400 font-medium">
                    {t.autoSavedFooter}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* PRIVACY POLICY & TERMS OF USE MODAL */}
          {showLegalModal && (
            <div 
              onClick={() => setShowLegalModal(false)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-xl wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-600 shadow-2xl text-amber-50 max-h-[85vh] flex flex-col cursor-default"
              >
                <button onClick={() => setShowLegalModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <h3 className="font-fredoka text-2xl font-bold text-amber-100 mb-3">{t.legalModalTitle}</h3>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-4 text-xs sm:text-sm text-amber-200/90 leading-relaxed space-y-3 overflow-y-auto">
                  <div>
                    <strong className="text-amber-300 font-bold block mb-1">{t.legalPrivacyTitle}</strong>
                    <p>{t.legalPrivacyText}</p>
                  </div>
                  <div>
                    <strong className="text-amber-300 font-bold block mb-1">{t.legalTermsTitle}</strong>
                    <p>{t.legalTermsText}</p>
                  </div>
                  <div>
                    <strong className="text-amber-300 font-bold block mb-1">{t.legalContactTitle}</strong>
                    <p>{t.legalContactText}</p>
                  </div>
                </div>
                <button onClick={() => setShowLegalModal(false)} className="btn-chunky btn-chunky-amber w-full bg-gradient-to-b from-amber-500 to-amber-600 text-amber-950 font-fredoka font-black text-sm py-3 rounded-2xl border-2 border-amber-950">
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* PRO TIP MODAL */}
          {showProTipModal && (
            <div 
              onClick={() => setShowProTipModal(false)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-md wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-500 shadow-2xl text-amber-50 cursor-default"
              >
                <button onClick={() => setShowProTipModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-2xl">💡</div>
                  <div>
                    <h3 className="font-fredoka text-2xl font-bold text-amber-100">{t.proTipTitle}</h3>
                    <p className="text-xs text-amber-300/80 font-medium">{t.proTipSubtitle}</p>
                  </div>
                </div>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-5 text-sm text-amber-200/90 leading-relaxed space-y-2.5">
                  <p>
                    <strong className="text-amber-300 font-bold block mb-1">{t.proTip1Title}</strong>
                    {t.proTip1Desc}
                  </p>
                  <p>
                    <strong className="text-amber-300 font-bold block mb-1">{t.proTip2Title}</strong>
                    {t.proTip2Desc}
                  </p>
                </div>
                <button onClick={() => setShowProTipModal(false)} className="btn-chunky btn-chunky-amber w-full bg-gradient-to-b from-amber-500 to-amber-600 text-amber-950 font-fredoka font-black text-base py-3 rounded-2xl border-2 border-amber-950 shadow-chunky-btn-amber">{t.gotItBtn}</button>
              </div>
            </div>
          )}

          {/* VICTORY MODAL OVERLAY */}
          {isWon && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="relative w-full max-w-md wood-texture rounded-3xl p-6 sm:p-8 border-4 border-amber-500 shadow-2xl text-center transform transition-all">
                <div className="w-20 h-20 mx-auto -mt-14 mb-3 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-3xl border-4 border-[#3a1a05] shadow-chunky-btn-amber flex items-center justify-center text-4xl">👑</div>
                <span className="inline-block bg-amber-400/20 text-amber-300 border border-amber-400/40 text-xs font-extrabold uppercase px-3 py-1 rounded-full tracking-widest mb-2">{t.puzzleSolvedBadge}</span>
                <h2 className="font-fredoka text-3xl sm:text-4xl font-black text-amber-100 drop-shadow-md">{t.victoryTitle}</h2>
                <p className="text-amber-200/90 text-sm mt-1 font-medium">{t.victoryDesc}</p>
                
                <div className="bg-[#241104] border-2 border-amber-800 rounded-2xl p-4 my-5 flex items-center justify-around shadow-inner">
                  <div className="flex flex-col items-center">
                    <span className="text-[11px] uppercase font-bold text-amber-400/80">{t.timeTaken}</span>
                    <span className="font-mono font-black text-2xl text-emerald-400">{formatTime(seconds)}</span>
                  </div>
                  <div className="w-px h-8 bg-amber-800/80"></div>
                  <div className="flex flex-col items-center">
                    <span className="text-[11px] uppercase font-bold text-amber-400/80">{t.stars}</span>
                    <div className="flex text-amber-400 text-lg">★★★</div>
                  </div>
                  <div className="w-px h-8 bg-amber-800/80"></div>
                  <div className="flex flex-col items-center">
                    <span className="text-[11px] uppercase font-bold text-amber-400/80">{t.challenge}</span>
                    <span className="font-fredoka font-bold text-base text-amber-200">{t.mateIn(selectedLevel)}</span>
                  </div>
                </div>

                <div className="space-y-3">
                  <button onClick={handleAnotherChallengeReload} className="btn-chunky btn-chunky-green w-full bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-fredoka font-black text-xl py-3.5 px-6 rounded-2xl border-3 border-emerald-950 shadow-chunky-btn-green flex items-center justify-center gap-3 cursor-pointer">
                    <span>{t.anotherChallengeBtn}</span>
                    <span className="text-2xl">➔</span>
                  </button>
                  <button onClick={() => setIsWon(false)} className="w-full text-amber-300 hover:text-white text-xs font-bold uppercase tracking-wider py-1.5 transition cursor-pointer">
                    {t.reviewBoardBtn}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PHYSICAL BOARD MERCHANDISING MODAL */}
          {showMerchModal && (
            <div 
              onClick={() => setShowMerchModal(false)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-lg wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-600 shadow-2xl text-amber-50 cursor-default"
              >
                <button onClick={() => setShowMerchModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-2xl">📦</div>
                  <div>
                    <h3 className="font-fredoka text-2xl font-bold text-amber-100">{t.merchModalTitle}</h3>
                    <p className="text-xs text-amber-300/80 font-medium">{t.merchModalSubtitle}</p>
                  </div>
                </div>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-4 flex items-center gap-4">
                  <div className="w-24 h-24 rounded-xl bg-amber-950 border border-amber-700/80 flex items-center justify-center text-4xl shadow-inner">♟️🪵</div>
                  <div className="flex-1 text-xs space-y-1">
                    <div className="font-bold text-amber-200 text-sm">{t.merchItemTitle}</div>
                    <div className="text-amber-400/90">{t.merchBullet1}</div>
                    <div className="text-amber-400/90">{t.merchBullet2}</div>
                    <div className="text-emerald-400 font-extrabold text-lg mt-1">$29.99 <span className="text-amber-300/60 line-through text-xs font-normal">$39.99</span></div>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => { alert(t.checkoutAlert); setShowMerchModal(false); }} className="btn-chunky btn-chunky-amber flex-1 bg-gradient-to-b from-amber-500 to-amber-600 hover:from-amber-400 text-amber-950 font-fredoka font-black text-lg py-3 rounded-2xl border-2 border-amber-950 shadow-chunky-btn-amber">{t.preOrderBtn}</button>
                  <button onClick={() => setShowMerchModal(false)} className="px-4 py-3 bg-[#2f1608] hover:bg-[#3d1e0b] rounded-2xl font-bold text-xs text-amber-200 border border-amber-800">{t.closeBtn}</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
