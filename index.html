    const STORAGE_KEY = '3x3chess_studio_prefs_v1';
    const WELCOMED_KEY = '3x3chess_welcomed_v1';

    const loadSavedPrefs = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    };

    const savePrefsToStorage = (prefs) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
      } catch (e) {}
    };

    const detectBrowserLanguage = () => {
      try {
        const langs = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
        for (const l of langs) {
          if (!l) continue;
          const short = l.toLowerCase().substring(0, 2);
          if (short === 'pt') return 'PT';
          if (short === 'es') return 'ES';
          if (short === 'fr') return 'FR';
          if (short === 'de') return 'DE';
          if (short === 'ru') return 'RU';
          if (short === 'en') return 'EN';
        }
      } catch (e) {}
      return 'EN';
    };

    // ========================================================
    // MOTOR DE SOM ACÚSTICO
    // ========================================================
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) sharedAudioCtx = new AudioContext();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    };

    const playGameSound = (type, enabled, volumePct) => {
      if (!enabled || volumePct <= 0) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const vol = (volumePct / 100) * 0.45;
      const now = ctx.currentTime;

      if (type === 'select') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(680, now + 0.045);
        gain.gain.setValueAtTime(vol * 0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'move') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(190, now); osc.frequency.exponentialRampToValueAtTime(55, now + 0.075);
        gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'capture') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(42, now + 0.12);
        gain.gain.setValueAtTime(vol * 1.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.13);
      } else if (type === 'check') {
        [587.33, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(vol * 0.7, now + idx * 0.09); gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.16);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + idx * 0.09); osc.stop(now + idx * 0.09 + 0.17);
        });
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; const start = now + idx * 0.09;
          osc.frequency.setValueAtTime(freq, start); gain.gain.setValueAtTime(vol * 0.85, start); gain.gain.exponentialRampToValueAtTime(0.001, start + 0.38);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(start); osc.stop(start + 0.4);
        });
      }
    };

    // 1. Validação Geométrica
    const isPseudoLegalMove = (boardState, piece, startR, startC, endR, endC) => {
      if (!piece) return false;
      if (startR === endR && startC === endC) return false;
      const rDiff = endR - startR;
      const cDiff = endC - startC;
      const absR = Math.abs(rDiff);
      const absC = Math.abs(cDiff);
      const target = boardState[endR][endC];
      
      if (target && target.color === piece.color) return false;

      const isPathClear = (dr, dc) => {
          let r = startR + dr; let c = startC + dc;
          while (r !== endR || c !== endC) {
              if (boardState[r][c] !== null) return false;
              r += dr; c += dc;
          }
          return true;
      };

      switch(piece.type) {
          case 'k': return absR <= 1 && absC <= 1;
          case 'n': return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
          case 'r': 
              if (startR !== endR && startC !== endC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'b':
              if (absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'q':
              if (startR !== endR && startC !== endC && absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'p':
              const dir = piece.color === 'w' ? -1 : 1;
              if (cDiff === 0 && rDiff === dir && !target) return true; 
              if (absC === 1 && rDiff === dir && target) return true; 
              return false;
          default: return false;
      }
    };

    // 2. Verifica se o Rei está em Xeque
    const isKingInCheck = (boardState, kingColor) => {
      let kingR = -1, kingC = -1;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === kingColor && p.type === 'k') {
            kingR = r; kingC = c;
            break;
          }
        }
      }
      if (kingR === -1) return true;

      const enemyColor = kingColor === 'w' ? 'b' : 'w';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === enemyColor) {
            if (isPseudoLegalMove(boardState, p, r, c, kingR, kingC)) return true;
          }
        }
      }
      return false;
    };

    // 3. Simula um movimento (com suporte a sub-promoção)
    const simulateMoveOnBoard = (boardState, startR, startC, endR, endC, promoteTo = 'q') => {
      const nextBoard = boardState.map(row => [...row]);
      let movingPiece = { ...nextBoard[startR][startC] };
      if (movingPiece.type === 'p') {
        if (movingPiece.color === 'w' && endR === 0) movingPiece.type = promoteTo;
        if (movingPiece.color === 'b' && endR === 2) movingPiece.type = promoteTo;
      }
      nextBoard[endR][endC] = movingPiece;
      nextBoard[startR][startC] = null;
      return nextBoard;
    };

    // 4. Validação Completa de Xadrez
    const isMoveLegal = (boardState, piece, startR, startC, endR, endC) => {
      if (!isPseudoLegalMove(boardState, piece, startR, startC, endR, endC)) return false;
      const simulatedBoard = simulateMoveOnBoard(boardState, startR, startC, endR, endC, 'q');
      return !isKingInCheck(simulatedBoard, piece.color);
    };

    // 5. Retorna todos os movimentos legais possíveis
    const getAllLegalMovesForPlayer = (boardState, color) => {
      const allMoves = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === color) {
            for (let er = 0; er < 3; er++) {
              for (let ec = 0; ec < 3; ec++) {
                if (isMoveLegal(boardState, p, r, c, er, ec)) {
                  allMoves.push({ startR: r, startC: c, endR: er, endC: ec });
                }
              }
            }
          }
        }
      }
      return allMoves;
    };

    function App() {

      useEffect(() => {

            if (legalMoves.length > 0) {

                const whiteMoves = getAllLegalMovesForPlayer(nextB, 'w');
                return !whiteMoves.some(wm => {

          const movingPiece = board[fromR][fromC];

          if (isMoveLegal(board, movingPiece, fromR, fromC, r, c)) {
            // Se for peão chegando no topo, já executa o movimento promovendo para Rainha ('q') automático!
            executeMove(fromR, fromC, r, c, 'q');
            return;
          } else {
            if (piece && piece.color === 'w') {
              playGameSound('select', soundEnabled, soundVolume);
              const targets = getLegalTargetsForPiece(r, c, piece);
              setSelectedSquare([r, c]); setValidMoves(targets);
              if (piece.type === 'p' && targets.length === 0) { setShowHint(true); setHintDetails(t.hintBlockedPawn); }
            } else { setSelectedSquare(null); setValidMoves([]); }
          }
        } else {
          if (piece && piece.color === 'w') {
            playGameSound('select', soundEnabled, soundVolume);
            const targets = getLegalTargetsForPiece(r, c, piece);
            setSelectedSquare([r, c]); setValidMoves(targets);
            if (piece.type === 'p' && targets.length === 0) { setShowHint(true); setHintDetails(t.hintBlockedPawn); }
          }
        }
      };

      const handleHint = () => {
  playGameSound('select', soundEnabled, soundVolume);
  
  // Se o Node.js já nos deu o lance perfeito mastigado ("a1b2"), apenas acendemos a tela instantaneamente!
  if (currentBestMove) {
    const cLetters = {'a':0, 'b':1, 'c':2};
    const rNumbers = {'3':0, '2':1, '1':2};
    const startC = cLetters[currentBestMove[0]];
    const startR = rNumbers[currentBestMove[1]];
    const endC = cLetters[currentBestMove[2]];
    const endR = rNumbers[currentBestMove[3]];
    
    setSelectedSquare([startR, startC]); 
    setValidMoves([[endR, endC]]);
    setShowHint(true); 
    setHintDetails(t.hintWinningMove(currentBestMove.substring(0,2), currentBestMove.substring(2,4)));
    return;
  }

  // Plano B (Fallback): Caso esteja carregando um JSON antigo sem solução, tenta o cálculo raso antigo
  const whiteMoves = getAllLegalMovesForPlayer(board, 'w');
  for (const m of whiteMoves) {
    const simBoard = simulateMoveOnBoard(board, m.startR, m.startC, m.endR, m.endC, 'q');
    if (isKingInCheck(simBoard, 'b') && getAllLegalMovesForPlayer(simBoard, 'b').length === 0) {
      const fromSq = `${String.fromCharCode(97 + m.startC)}${3 - m.startR}`;
      const toSq = `${String.fromCharCode(97 + m.endC)}${3 - m.endR}`;
      setSelectedSquare([m.startR, m.startC]); setValidMoves([[m.endR, m.endC]]);
      setShowHint(true); setHintDetails(t.hintWinningMove(fromSq, toSq));
      return;
    }
  }
  if (whiteMoves.length > 0) {
    const sample = whiteMoves[0];
    const piece = board[sample.startR][sample.startC];
    setSelectedSquare([sample.startR, sample.startC]); setValidMoves(getLegalTargetsForPiece(sample.startR, sample.startC, piece));
    setShowHint(true); setHintDetails(t.hintGeneral);
  }
};

      const formatTime = (totalSec) => {

                    <div className="absolute top-2 left-2 w-2.5 h-2.5 rounded-full bg-amber-950 border border-amber-600/50 shadow-inner"></div>

                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.soundsTitle}</div><div className="text-[11px] text-gray-400">{t.soundsDesc}</div></div>
                        <button type="button" onClick={() => { const next = !soundEnabled; setSoundEnabled(next); if (next) playGameSound('move', true, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${soundEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.hapticsTitle}</div><div className="text-[11px] text-gray-400">{t.hapticsDesc}</div></div>
                        <button type="button" onClick={() => { const next = !hapticsEnabled; setHapticsEnabled(next); if (next) triggerHaptic(true, 30); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${hapticsEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.showTimerTitle}</div><div className="text-[11px] text-gray-400">{t.showTimerDesc}</div></div>
                        <button type="button" onClick={() => { setShowTimerUI(!showTimerUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showTimerUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.showMovesTitle}</div><div className="text-[11px] text-gray-400">{t.showMovesDesc}</div></div>
                        <button type="button" onClick={() => { setShowMovesUI(!showMovesUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showMovesUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.rotateBoardTitle}</div><div className="text-[11px] text-gray-400">{t.rotateBoardDesc}</div></div>
                        <button type="button" onClick={() => { setRotateBoardUI(!rotateBoardUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${rotateBoardUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                    </div>
                  </div>
                  <div className="px-6 py-3 border-t border-[#2e313a] text-center text-[11px] text-gray-400 font-medium">{t.autoSavedFooter}</div>
                </div>
              </div>
            </div>
          )}

          {/* LEGAL MODAL */}
          {showLegalModal && (
            <div onClick={() => setShowLegalModal(false)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className="relative w-full max-w-xl wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-600 shadow-2xl text-amber-50 max-h-[85vh] flex flex-col cursor-default">
                <button onClick={() => setShowLegalModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <h3 className="font-fredoka text-2xl font-bold text-amber-100 mb-3">{t.legalModalTitle}</h3>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-4 text-xs sm:text-sm text-amber-200/90 leading-relaxed space-y-3 overflow-y-auto">
                  <div><strong className="text-amber-300 font-bold block mb-1">{t.legalPrivacyTitle}</strong><p>{t.legalPrivacyText}</p></div>
                  <div><strong className="text-amber-300 font-bold block mb-1">{t.legalTermsTitle}</strong><p>{t.legalTermsText}</p></div>
                  <div><strong className="text-amber-300 font-bold block mb-1">{t.legalContactTitle}</strong><p>{t.legalContactText}</p></div>
                </div>
                <button onClick={() => setShowLegalModal(false)} className="btn-chunky btn-chunky-amber w-full bg-gradient-to-b from-amber-500 to-amber-600 text-amber-950 font-fredoka font-black text-sm py-3 rounded-2xl border-2 border-amber-950">{t.closeBtn}</button>
              </div>
            </div>
          )}

          {/* VICTORY MODAL */}
          {isWon && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="relative w-full max-w-md wood-texture rounded-3xl p-6 sm:p-8 border-4 border-amber-500 shadow-2xl text-center transform transition-all">
                <div className="w-20 h-20 mx-auto -mt-14 mb-3 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-3xl border-4 border-[#3a1a05] shadow-chunky-btn-amber flex items-center justify-center text-4xl">👑</div>
                <span className="inline-block bg-amber-400/20 text-amber-300 border border-amber-400/40 text-xs font-extrabold uppercase px-3 py-1 rounded-full tracking-widest mb-2">{t.puzzleSolvedBadge}</span>
                <h2 className="font-fredoka text-3xl sm:text-4xl font-black text-amber-100 drop-shadow-md">{t.victoryTitle}</h2>
                <p className="text-amber-200/90 text-sm mt-1 font-medium">{t.victoryDesc}</p>
                <div className="bg-[#241104] border-2 border-amber-800 rounded-2xl p-4 my-5 flex items-center justify-around shadow-inner">
                  <div className="flex flex-col items-center"><span className="text-[11px] uppercase font-bold text-amber-400/80">{t.timeTaken}</span><span className="font-mono font-black text-2xl text-emerald-400">{formatTime(seconds)}</span></div>
                  <div className="w-px h-8 bg-amber-800/80"></div>
                  <div className="flex flex-col items-center"><span className="text-[11px] uppercase font-bold text-amber-400/80">{t.stars}</span><div className="flex text-amber-400 text-lg">★★★</div></div>
                  <div className="w-px h-8 bg-amber-800/80"></div>
                  <div className="flex flex-col items-center"><span className="text-[11px] uppercase font-bold text-amber-400/80">{t.challenge}</span><span className="font-fredoka font-bold text-base text-amber-200">{t.mateIn(selectedLevel)}</span></div>
                </div>
                <div className="space-y-3">
                  <button onClick={handleAnotherChallengeSPA} className="btn-chunky btn-chunky-green w-full bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-fredoka font-black text-xl py-3.5 px-6 rounded-2xl border-3 border-emerald-950 shadow-chunky-btn-green flex items-center justify-center gap-3 cursor-pointer"><span>{t.anotherChallengeBtn}</span><span className="text-2xl">➔</span></button>
                  <button onClick={() => setIsWon(false)} className="w-full text-amber-300 hover:text-white text-xs font-bold uppercase tracking-wider py-1.5 transition cursor-pointer">{t.reviewBoardBtn}</button>
                </div>
              </div>
            </div>
          )}

          {/* MERCH MODAL */}
          {showMerchModal && (
            <div onClick={() => setShowMerchModal(false)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className="relative w-full max-w-lg wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-600 shadow-2xl text-amber-50 cursor-default">
                <button onClick={() => setShowMerchModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-2xl">📦</div><div><h3 className="font-fredoka text-2xl font-bold text-amber-100">{t.merchModalTitle}</h3><p className="text-xs text-amber-300/80 font-medium">{t.merchModalSubtitle}</p></div></div>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-4 flex items-center gap-4">
                  <div className="w-24 h-24 rounded-xl bg-amber-950 border border-amber-700/80 flex items-center justify-center text-4xl shadow-inner">♟️🪵</div>
                  <div className="flex-1 text-xs space-y-1"><div className="font-bold text-amber-200 text-sm">{t.merchItemTitle}</div><div className="text-amber-400/90">{t.merchBullet1}</div><div className="text-amber-400/90">{t.merchBullet2}</div><div className="text-emerald-400 font-extrabold text-lg mt-1">$29.99 <span className="text-amber-300/60 line-through text-xs font-normal">$39.99</span></div></div>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => { alert(t.checkoutAlert); setShowMerchModal(false); }} className="btn-chunky btn-chunky-amber flex-1 bg-gradient-to-b from-amber-500 to-amber-600 hover:from-amber-400 text-amber-950 font-fredoka font-black text-lg py-3 rounded-2xl border-2 border-amber-950 shadow-chunky-btn-amber">{t.preOrderBtn}</button>
                  <button onClick={() => setShowMerchModal(false)} className="px-4 py-3 bg-[#2f1608] hover:bg-[#3d1e0b] rounded-2xl font-bold text-xs text-amber-200 border border-amber-800">{t.closeBtn}</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Bloqueio do Menu de Contexto (Botão Direito) para melhorar a UX do jogo -->
<script>document.addEventListener('contextmenu', event => event.preventDefault());</script>
</body>
</html>
