    const { useState, useEffect, useRef } = React;

    // ============================================================================
    // 🎬 CONFIGURAÇÃO DE TEMPOS DE ANIMAÇÃO (PARA GRAVAÇÃO DE VÍDEO)
    // ============================================================================
    // 1. Tempo que o tabuleiro fica 100% VAZIO no início (em milissegundos):
    //    5000 = 5 segundos. Se quiser 3 segundos, mude para 3000.
    const EMPTY_BOARD_DELAY_MS = 5000;

    // 2. Intervalo de tempo entre o pop-up de uma peça e a próxima (em milissegundos):
    //    280 = 0.28 segundos entre cada peça. Diminua (ex: 150) para surgir mais rápido
    //    ou aumente (ex: 400) para surgir mais devagar.
    const PIECE_POPUP_INTERVAL_MS = 280;

    // 3. Tocar efeito sonoro quando cada peça aparece no pop-up inicial?
    //    true = toca um som suave a cada peça | false = surge em silêncio
    const PLAY_SOUND_ON_POPUP = true;
    // ============================================================================

    const STORAGE_KEY = '3x3chess_studio_prefs_v1';
    const WELCOMED_KEY = '3x3chess_welcomed_v1';

    const loadSavedPrefs = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    };

    const savePrefsToStorage = (prefs) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
      } catch (e) {}
    };

    const detectBrowserLanguage = () => {
      try {
        const langs = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
        for (const l of langs) {
          if (!l) continue;
          const short = l.toLowerCase().substring(0, 2);
          if (short === 'pt') return 'PT';
          if (short === 'es') return 'ES';
          if (short === 'fr') return 'FR';
          if (short === 'de') return 'DE';
          if (short === 'ru') return 'RU';
          if (short === 'en') return 'EN';
        }
      } catch (e) {}
      return 'EN';
    };

    // ========================================================
    // MOTOR DE SOM ACÚSTICO
    // ========================================================
    let sharedAudioCtx = null;
    const getAudioCtx = () => {
      if (!sharedAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) sharedAudioCtx = new AudioContext();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    };

    const playGameSound = (type, enabled, volumePct) => {
      if (!enabled || volumePct <= 0) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const vol = (volumePct / 100) * 0.45;
      const now = ctx.currentTime;

      if (type === 'select') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(680, now + 0.045);
        gain.gain.setValueAtTime(vol * 0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'move') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(190, now); osc.frequency.exponentialRampToValueAtTime(55, now + 0.075);
        gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'capture') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(42, now + 0.12);
        gain.gain.setValueAtTime(vol * 1.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.13);
      } else if (type === 'check') {
        [587.33, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(vol * 0.7, now + idx * 0.09); gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.16);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + idx * 0.09); osc.stop(now + idx * 0.09 + 0.17);
        });
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; const start = now + idx * 0.09;
          osc.frequency.setValueAtTime(freq, start); gain.gain.setValueAtTime(vol * 0.85, start); gain.gain.exponentialRampToValueAtTime(0.001, start + 0.38);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(start); osc.stop(start + 0.4);
        });
      }
    };

    // ========================================================
    // REDESIGN DOS SVGs DE PEÇAS DE XADREZ
    // ========================================================
    function ChessPieceIcon({ type, color = 'w', size = 60 }) {
      const isWhite = color === 'w';
      const mainFill = isWhite ? '#FFFFFF' : '#4a4a58';
      const strokeColor = isWhite ? '#361D0C' : '#0e0e14';
      const accentGold = '#F59E0B';

      switch (type) {
        case 'k':
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-k-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-k-${color})`}>
                <path d="M 22 80 L 78 80 L 68 65 L 32 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 32 65 C 10 40, 30 25, 50 35 C 70 25, 90 40, 68 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 40 65 C 40 45, 60 45, 60 65" fill="none" stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 50 35 L 50 10 M 40 18 L 60 18" stroke={strokeColor} strokeWidth="4" strokeLinecap="round"/>
              </g>
            </svg>
          );
        case 'q':
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-q-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-q-${color})`}>
                <path d="M 22 80 L 78 80 L 68 65 L 32 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 32 65 L 18 30 L 38 45 L 50 15 L 62 45 L 82 30 L 68 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <circle cx="18" cy="30" r="4" fill={accentGold} stroke={strokeColor} strokeWidth="2.5"/>
                <circle cx="38" cy="45" r="4" fill={accentGold} stroke={strokeColor} strokeWidth="2.5"/>
                <circle cx="50" cy="15" r="4" fill={accentGold} stroke={strokeColor} strokeWidth="2.5"/>
                <circle cx="62" cy="45" r="4" fill={accentGold} stroke={strokeColor} strokeWidth="2.5"/>
                <circle cx="82" cy="30" r="4" fill={accentGold} stroke={strokeColor} strokeWidth="2.5"/>
              </g>
            </svg>
          );
        case 'r':
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-r-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-r-${color})`}>
                <path d="M 22 80 L 78 80 L 68 65 L 32 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 35 65 L 65 65 L 65 40 L 75 40 L 75 20 L 61 20 L 61 30 L 54 30 L 54 20 L 46 20 L 46 30 L 39 30 L 39 20 L 25 20 L 25 40 L 35 40 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
              </g>
            </svg>
          );
        case 'n':
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-n-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-n-${color})`}>
                <path d="M 22 80 L 78 80 L 68 65 L 32 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <path d="M 68 65 L 62 40 L 58 22 L 52 14 L 45 22 L 25 38 L 22 50 L 27 58 L 42 52 L 36 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round"/>
                <circle cx="43" cy="32" r="3" fill={strokeColor}/>
              </g>
            </svg>
          );
        case 'b':
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-b-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-b-${color})`}>
                <path d="M 22 80 L 78 80 L 65 65 L 35 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round" />
                <path d="M 38 65 C 30 40, 50 25, 50 25 C 50 25, 70 40, 62 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round" />
                <circle cx="50" cy="18" r="5" fill={mainFill} stroke={strokeColor} strokeWidth="4" />
                <path d="M 43 38 L 57 52" stroke={strokeColor} strokeWidth="4" strokeLinecap="round" />
              </g>
            </svg>
          );
        case 'p':
        default:
          return (
            <svg width={size} height={size} viewBox="0 0 100 100" className="drop-shadow-md">
              <filter id={`shadow-p-${color}`}><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" floodOpacity="0.35"/></filter>
              <g filter={`url(#shadow-p-${color})`}>
                <path d="M 25 80 L 75 80 L 65 65 L 35 65 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round" />
                <path d="M 38 65 L 62 65 L 55 45 L 45 45 Z" fill={mainFill} stroke={strokeColor} strokeWidth="4" strokeLinejoin="round" />
                <circle cx="50" cy="32" r="14" fill={mainFill} stroke={strokeColor} strokeWidth="4" />
              </g>
            </svg>
          );
      }
    }

    // 1. Validação Geométrica
    const isPseudoLegalMove = (boardState, piece, startR, startC, endR, endC) => {
      if (!piece) return false;
      if (startR === endR && startC === endC) return false;
      const rDiff = endR - startR;
      const cDiff = endC - startC;
      const absR = Math.abs(rDiff);
      const absC = Math.abs(cDiff);
      const target = boardState[endR][endC];
      
      if (target && target.color === piece.color) return false;

      const isPathClear = (dr, dc) => {
          let r = startR + dr; let c = startC + dc;
          while (r !== endR || c !== endC) {
              if (boardState[r][c] !== null) return false;
              r += dr; c += dc;
          }
          return true;
      };

      switch(piece.type) {
          case 'k': return absR <= 1 && absC <= 1;
          case 'n': return (absR === 2 && absC === 1) || (absR === 1 && absC === 2);
          case 'r': 
              if (startR !== endR && startC !== endC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'b':
              if (absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'q':
              if (startR !== endR && startC !== endC && absR !== absC) return false;
              return isPathClear(Math.sign(rDiff), Math.sign(cDiff));
          case 'p':
              const dir = piece.color === 'w' ? -1 : 1;
              if (cDiff === 0 && rDiff === dir && !target) return true; 
              if (absC === 1 && rDiff === dir && target) return true; 
              return false;
          default: return false;
      }
    };

    // 2. Verifica se o Rei está em Xeque
    const isKingInCheck = (boardState, kingColor) => {
      let kingR = -1, kingC = -1;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === kingColor && p.type === 'k') {
            kingR = r; kingC = c;
            break;
          }
        }
      }
      if (kingR === -1) return true;

      const enemyColor = kingColor === 'w' ? 'b' : 'w';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === enemyColor) {
            if (isPseudoLegalMove(boardState, p, r, c, kingR, kingC)) return true;
          }
        }
      }
      return false;
    };

    // 3. Simula um movimento
    const simulateMoveOnBoard = (boardState, startR, startC, endR, endC, promoteTo = 'q') => {
      const nextBoard = boardState.map(row => [...row]);
      let movingPiece = { ...nextBoard[startR][startC] };
      if (movingPiece.type === 'p') {
        if (movingPiece.color === 'w' && endR === 0) movingPiece.type = promoteTo;
        if (movingPiece.color === 'b' && endR === 2) movingPiece.type = promoteTo;
      }
      nextBoard[endR][endC] = movingPiece;
      nextBoard[startR][startC] = null;
      return nextBoard;
    };

    // 4. Validação Completa de Xadrez
    const isMoveLegal = (boardState, piece, startR, startC, endR, endC) => {
      if (!isPseudoLegalMove(boardState, piece, startR, startC, endR, endC)) return false;
      const simulatedBoard = simulateMoveOnBoard(boardState, startR, startC, endR, endC, 'q');
      return !isKingInCheck(simulatedBoard, piece.color);
    };

    // 5. Retorna todos os movimentos legais possíveis
    const getAllLegalMovesForPlayer = (boardState, color) => {
      const allMoves = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const p = boardState[r][c];
          if (p && p.color === color) {
            for (let er = 0; er < 3; er++) {
              for (let ec = 0; ec < 3; ec++) {
                if (isMoveLegal(boardState, p, r, c, er, ec)) {
                  allMoves.push({ startR: r, startC: c, endR: er, endC: ec });
                }
              }
            }
          }
        }
      }
      return allMoves;
    };

    function App() {
      const saved = loadSavedPrefs();

      const [puzzleDatabase, setPuzzleDatabase] = useState([]);
      const [currentFen, setCurrentFen] = useState('');
      const [currentBestMove, setCurrentBestMove] = useState(null);
      const [board, setBoard] = useState(Array(3).fill(Array(3).fill(null)));
      const [currentTurn, setCurrentTurn] = useState('w');
      const [isComputerThinking, setIsComputerThinking] = useState(false);
      
      // ESTADOS DA ANIMAÇÃO DE SURGIMENTO DAS PEÇAS (POP-UP UM POR UM)
      const [revealedSquares, setRevealedSquares] = useState([]);
      const [isIntroAnimating, setIsIntroAnimating] = useState(false);
      const introTimeoutsRef = useRef([]);

      const [selectedLevel, setSelectedLevel] = useState(saved?.selectedLevel || 1);
      const [language, setLanguage] = useState(saved?.language || detectBrowserLanguage());

      const [selectedSquare, setSelectedSquare] = useState(null); 
      const [validMoves, setValidMoves] = useState([]);
      const [pendingPromotion, setPendingPromotion] = useState(null);
      
      const [seconds, setSeconds] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);
      const [isWon, setIsWon] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [hintDetails, setHintDetails] = useState('');
      
      // Na versão de captura, o modal de tutorial começa FECHADO (false) para não atrapalhar o vídeo
      const [showSplashModal, setShowSplashModal] = useState(false);

      const [showMerchModal, setShowMerchModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [tutorialStep, setTutorialStep] = useState(0);

      const [soundEnabled, setSoundEnabled] = useState(saved?.soundEnabled ?? true);
      const [soundVolume, setSoundVolume] = useState(saved?.soundVolume ?? 75);
      const [hapticsEnabled, setHapticsEnabled] = useState(saved?.hapticsEnabled ?? false);
      const [showTimerUI, setShowTimerUI] = useState(saved?.showTimerUI ?? true);
      const [showMovesUI, setShowMovesUI] = useState(saved?.showMovesUI ?? true);
      const [rotateBoardUI, setRotateBoardUI] = useState(saved?.rotateBoardUI ?? false);

      const t = TRANSLATIONS[language] || TRANSLATIONS.EN;

      // Limpa qualquer timeout de animação pendente ao desmontar ou trocar de jogo
      const clearIntroTimeouts = () => {
        introTimeoutsRef.current.forEach(tId => clearTimeout(tId));
        introTimeoutsRef.current = [];
      };

      const handleDismissSplash = () => {
        try { localStorage.setItem(WELCOMED_KEY, 'true'); } catch (e) {}
        playGameSound('move', soundEnabled, soundVolume);
        setShowSplashModal(false);
      };

      useEffect(() => {
        savePrefsToStorage({ selectedLevel, language, soundEnabled, soundVolume, hapticsEnabled, showTimerUI, showMovesUI, rotateBoardUI });
      }, [selectedLevel, language, soundEnabled, soundVolume, hapticsEnabled, showTimerUI, showMovesUI, rotateBoardUI]);

      const handleResetSettings = () => {
        setSoundEnabled(true); setSoundVolume(75); setHapticsEnabled(false);
        setShowTimerUI(true); setShowMovesUI(true); setRotateBoardUI(false);
        playGameSound('select', true, 75);
      };

      useEffect(() => {
        const fetchPuzzles = async () => {
          try {
            const levelStr = selectedLevel.toString().padStart(2, '0');
            const res = await fetch(`./puzzles/matein${levelStr}.json`);
            if(res.ok) {
              const data = await res.json();
              const validPuzzles = Array.isArray(data) ? data.filter(item => {
                const fenStr = typeof item === 'string' ? item : item.fen;
                return typeof fenStr === 'string' && fenStr.trim().length === 10 && fenStr.trim().startsWith('w');
              }) : [];

              if (validPuzzles.length > 0) {
                setPuzzleDatabase(validPuzzles);
                loadRandomPuzzle(validPuzzles);
              } else throw new Error("Nenhum puzzle válido encontrado");
            } else throw new Error(`Arquivo não encontrado`);
          } catch (e) {
            const demoDB = ["wK.k..NqRn", "w..k.r.K.q", "w.rk.K..q."];
            setPuzzleDatabase(demoDB);
            loadRandomPuzzle(demoDB);
          }
        };
        fetchPuzzles();
        return () => clearIntroTimeouts();
      }, [selectedLevel]);

      useEffect(() => {
        let interval = null;
        if (timerRunning && !isWon && !showSplashModal && !pendingPromotion && !isIntroAnimating) {
          interval = setInterval(() => { setSeconds(prev => prev + 1); }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [timerRunning, isWon, showSplashModal, pendingPromotion, isIntroAnimating]);

      useEffect(() => {
        if (isWon && window.confetti) {
          window.confetti({ particleCount: 140, spread: 90, origin: { y: 0.55 }, colors: ['#F59E0B', '#10B981', '#3B82F6', '#EF4444', '#FFF3D4'] });
        }
      }, [isWon]);

      useEffect(() => {
        if (currentTurn === 'b' && !isWon && timerRunning && !pendingPromotion && !isIntroAnimating) {
          setIsComputerThinking(true);
          const timer = setTimeout(() => {
            const legalMoves = getAllLegalMovesForPlayer(board, 'b');
            if (legalMoves.length > 0) {
              let safeMoves = legalMoves.filter(m => {
                const nextB = simulateMoveOnBoard(board, m.startR, m.startC, m.endR, m.endC, 'q');
                const whiteMoves = getAllLegalMovesForPlayer(nextB, 'w');
                return !whiteMoves.some(wm => {
                  const afterWhiteB = simulateMoveOnBoard(nextB, wm.startR, wm.startC, wm.endR, wm.endC, 'q');
                  return isKingInCheck(afterWhiteB, 'b') && getAllLegalMovesForPlayer(afterWhiteB, 'b').length === 0;
                });
              });
              const pool = safeMoves.length > 0 ? safeMoves : legalMoves;
              const chosen = pool[Math.floor(Math.random() * pool.length)];
              executeMove(chosen.startR, chosen.startC, chosen.endR, chosen.endC, 'q');
            } else {
              if (isKingInCheck(board, 'b')) {
                playGameSound('win', soundEnabled, soundVolume); setIsWon(true); setTimerRunning(false);
              } else {
                setShowHint(true); setHintDetails(t.msgStalemate); setTimerRunning(false);
              }
            }
            setIsComputerThinking(false);
          }, 550);
          return () => clearTimeout(timer);
        }
      }, [currentTurn, board, isWon, timerRunning, pendingPromotion, language, isIntroAnimating]);

      const loadRandomPuzzle = (db = puzzleDatabase) => {
        if(db.length === 0) return;
        const puzzle = db[Math.floor(Math.random() * db.length)];
        const fenString = typeof puzzle === 'string' ? puzzle : puzzle.fen;
        const best = typeof puzzle === 'string' ? null : puzzle.bestMove;
        
        setCurrentFen(fenString);
        setCurrentBestMove(best);
        parseFenToBoard(fenString);
      };

      // ==========================================================================
      // 🎬 FUNÇÃO QUE CONTROLA O TABULEIRO VAZIO (5s) + POP-UP PEÇA POR PEÇA
      // ==========================================================================
      const parseFenToBoard = (fen) => {
        clearIntroTimeouts();

        const boardStr = fen.substring(1);
        const newBoard = [[null,null,null], [null,null,null], [null,null,null]];
        const occupiedSquares = [];
        let idx = 0;

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const char = boardStr[idx++];
            if (char !== '.') {
              newBoard[r][c] = { color: char === char.toUpperCase() ? 'w' : 'b', type: char.toLowerCase() };
              occupiedSquares.push(`${r}-${c}`);
            }
          }
        }

        // Prepara o estado inicial com o tabuleiro visualmente VAZIO (revealedSquares = [])
        setBoard(newBoard);
        setCurrentTurn('w');
        setSelectedSquare(null);
        setValidMoves([]);
        setSeconds(0);
        setTimerRunning(false); // O cronômetro só começa quando todas as peças terminarem de surgir!
        setIsWon(false);
        setShowHint(false);
        setIsComputerThinking(false);
        setPendingPromotion(null);
        setRevealedSquares([]);
        setIsIntroAnimating(true);

        // Agendamento do pop-up de cada peça após os 5 segundos (EMPTY_BOARD_DELAY_MS)
        occupiedSquares.forEach((sqKey, pieceIdx) => {
          const delay = EMPTY_BOARD_DELAY_MS + (pieceIdx * PIECE_POPUP_INTERVAL_MS);
          const tId = setTimeout(() => {
            setRevealedSquares(prev => [...prev, sqKey]);
            if (PLAY_SOUND_ON_POPUP) {
              playGameSound('select', soundEnabled, soundVolume);
            }
          }, delay);
          introTimeoutsRef.current.push(tId);
        });

        // Libera o jogo e inicia o cronômetro assim que a última peça aparece
        const totalIntroDuration = EMPTY_BOARD_DELAY_MS + (occupiedSquares.length * PIECE_POPUP_INTERVAL_MS) + 150;
        const unlockId = setTimeout(() => {
          setIsIntroAnimating(false);
          setTimerRunning(true);
        }, totalIntroDuration);
        introTimeoutsRef.current.push(unlockId);
      };

      const handleRestart = () => { playGameSound('select', soundEnabled, soundVolume); if(currentFen) parseFenToBoard(currentFen); };

      const handleNewGame = () => { 
        playGameSound('select', soundEnabled, soundVolume); 
        loadRandomPuzzle(); 
      };

      const handleAnotherChallengeSPA = () => {
        try { localStorage.setItem(WELCOMED_KEY, 'true'); } catch (e) {}
        savePrefsToStorage({ selectedLevel, language, soundEnabled, soundVolume, hapticsEnabled, showTimerUI, showMovesUI, rotateBoardUI });
        setIsWon(false);
        loadRandomPuzzle();
      };

      const handleLanguageChange = (newLang) => {
        playGameSound('select', soundEnabled, soundVolume);
        setLanguage(newLang);
        if (!showSplashModal) loadRandomPuzzle();
      };

      const getLegalTargetsForPiece = (r, c, piece) => {
        const moves = [];
        for (let tr = 0; tr < 3; tr++) {
          for (let tc = 0; tc < 3; tc++) {
            if (isMoveLegal(board, piece, r, c, tr, tc)) moves.push([tr, tc]);
          }
        }
        return moves;
      };

      const executeMove = (startR, startC, endR, endC, promoteTo = 'q') => {
        const movingPiece = board[startR][startC];
        const targetPiece = board[endR][endC];
        const newBoard = simulateMoveOnBoard(board, startR, startC, endR, endC, promoteTo);

        setBoard(newBoard); setSelectedSquare(null); setValidMoves([]); setShowHint(false);
        triggerHaptic(hapticsEnabled, 20);

        const nextTurn = movingPiece.color === 'w' ? 'b' : 'w';
        const opponentLegalMoves = getAllLegalMovesForPlayer(newBoard, nextTurn);
        const opponentInCheck = isKingInCheck(newBoard, nextTurn);

        if (opponentLegalMoves.length === 0) {
          if (opponentInCheck) {
            if (movingPiece.color === 'w') {
              playGameSound('win', soundEnabled, soundVolume); triggerHaptic(hapticsEnabled, [40, 60, 80]); setIsWon(true); setTimerRunning(false);
            } else {
              playGameSound('check', soundEnabled, soundVolume); setShowHint(true); setHintDetails(t.msgComputerWon); setTimerRunning(false);
            }
          } else {
            playGameSound('move', soundEnabled, soundVolume); setShowHint(true); setHintDetails(t.msgStalemate); setTimerRunning(false);
          }
          return;
        }

        if (opponentInCheck) playGameSound('check', soundEnabled, soundVolume);
        else if (targetPiece) playGameSound('capture', soundEnabled, soundVolume);
        else playGameSound('move', soundEnabled, soundVolume);

        setCurrentTurn(nextTurn);
      };

      const handleSquareClick = (r, c) => {
        // Bloqueia cliques enquanto o tabuleiro está vazio ou animando o pop-up inicial
        if (isIntroAnimating || isWon || currentTurn !== 'w' || isComputerThinking || !timerRunning || pendingPromotion) return;
        const piece = board[r][c];

        if (selectedSquare && selectedSquare[0] === r && selectedSquare[1] === c) {
          setSelectedSquare(null); setValidMoves([]); return;
        }

        if (selectedSquare) {
          const [fromR, fromC] = selectedSquare;
          const movingPiece = board[fromR][fromC];

          if (isMoveLegal(board, movingPiece, fromR, fromC, r, c)) {
            executeMove(fromR, fromC, r, c, 'q');
            return;
          } else {
            if (piece && piece.color === 'w') {
              playGameSound('select', soundEnabled, soundVolume);
              const targets = getLegalTargetsForPiece(r, c, piece);
              setSelectedSquare([r, c]); setValidMoves(targets);
              if (piece.type === 'p' && targets.length === 0) { setShowHint(true); setHintDetails(t.hintBlockedPawn); }
            } else { setSelectedSquare(null); setValidMoves([]); }
          }
        } else {
          if (piece && piece.color === 'w') {
            playGameSound('select', soundEnabled, soundVolume);
            const targets = getLegalTargetsForPiece(r, c, piece);
            setSelectedSquare([r, c]); setValidMoves(targets);
            if (piece.type === 'p' && targets.length === 0) { setShowHint(true); setHintDetails(t.hintBlockedPawn); }
          }
        }
      };

      const handleHint = () => {
        if (isIntroAnimating) return;
        playGameSound('select', soundEnabled, soundVolume);
        
        if (currentBestMove) {
          const cLetters = {'a':0, 'b':1, 'c':2};
          const rNumbers = {'3':0, '2':1, '1':2};
          const startC = cLetters[currentBestMove[0]];
          const startR = rNumbers[currentBestMove[1]];
          const endC = cLetters[currentBestMove[2]];
          const endR = rNumbers[currentBestMove[3]];
          
          setSelectedSquare([startR, startC]); 
          setValidMoves([[endR, endC]]);
          setShowHint(true); 
          setHintDetails(t.hintWinningMove(currentBestMove.substring(0,2), currentBestMove.substring(2,4)));
          return;
        }

        const whiteMoves = getAllLegalMovesForPlayer(board, 'w');
        for (const m of whiteMoves) {
          const simBoard = simulateMoveOnBoard(board, m.startR, m.startC, m.endR, m.endC, 'q');
          if (isKingInCheck(simBoard, 'b') && getAllLegalMovesForPlayer(simBoard, 'b').length === 0) {
            const fromSq = `${String.fromCharCode(97 + m.startC)}${3 - m.startR}`;
            const toSq = `${String.fromCharCode(97 + m.endC)}${3 - m.endR}`;
            setSelectedSquare([m.startR, m.startC]); setValidMoves([[m.endR, m.endC]]);
            setShowHint(true); setHintDetails(t.hintWinningMove(fromSq, toSq));
            return;
          }
        }
        if (whiteMoves.length > 0) {
          const sample = whiteMoves[0];
          const piece = board[sample.startR][sample.startC];
          setSelectedSquare([sample.startR, sample.startC]); setValidMoves(getLegalTargetsForPiece(sample.startR, sample.startC, piece));
          setShowHint(true); setHintDetails(t.hintGeneral);
        }
      };

      const formatTime = (totalSec) => {
        const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // Só exibe alerta de xeque se todas as peças já tiverem aparecido
      const whiteInCheck = !isIntroAnimating && isKingInCheck(board, 'w');
      const blackInCheck = !isIntroAnimating && isKingInCheck(board, 'b');
      const selectedPieceObj = selectedSquare ? board[selectedSquare[0]][selectedSquare[1]] : null;
      const selectedSqStr = selectedSquare ? `${String.fromCharCode(97 + selectedSquare[1])}${3 - selectedSquare[0]}` : '';

      const displayRows = rotateBoardUI ? [2, 1, 0] : [0, 1, 2];
      const displayCols = rotateBoardUI ? [2, 1, 0] : [0, 1, 2];

      return (
        <div className="flex flex-col min-h-screen text-amber-50">
          
          <nav className="wood-texture border-b-2 border-[#331707] shadow-md px-2 py-2 sm:px-4 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-1 sm:gap-3">
              <div className="flex items-center gap-1.5 sm:gap-3 cursor-pointer" onClick={() => setShowSplashModal(true)}>
                <div className="w-9 h-9 sm:w-11 sm:h-11 bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 rounded-xl border-2 border-[#2b1203] shadow-md flex items-center justify-center relative">
                  <span className="text-xl sm:text-2xl drop-shadow select-none">👑</span>
                </div>
                <div className="hidden sm:block">
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-fredoka text-xl font-black text-amber-100 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">3x3<span className="text-amber-400">Chess</span></h1>
                    <span className="bg-amber-600/90 text-white font-fredoka text-[9px] font-bold px-1.5 py-0.5 rounded-sm uppercase tracking-wider shadow">Studio</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2 bg-[#241104]/80 border border-[#4b260c] rounded-xl p-1 sm:p-1.5 shadow-inner">
                {showTimerUI && (
                  <div className="flex flex-col items-center justify-center px-2 py-1 bg-[#1a0b02] rounded-lg border border-amber-900/60 min-w-[48px]">
                    <span className="text-[8px] sm:text-[9px] uppercase font-bold text-amber-400/70 leading-none mb-0.5">{t.timer}</span>
                    <span className="font-mono font-black text-xs sm:text-sm text-emerald-300 leading-none">{formatTime(seconds)}</span>
                  </div>
                )}
                
                <select 
                  value={selectedLevel}
                  onChange={(e) => { playGameSound('select', soundEnabled, soundVolume); setSelectedLevel(Number(e.target.value)); }}
                  className="custom-select bg-[#1b0d03] text-amber-200 border border-amber-600/60 rounded-lg text-xs font-bold py-1.5 pl-2 sm:pl-3 cursor-pointer focus:outline-none focus:border-amber-400 shadow-sm transition-colors"
                >
                  {[...Array(15)].map((_, i) => ( <option key={i + 1} value={i + 1}>{t.mateIn(i + 1)}</option> ))}
                </select>

                    </button>
                    <div className="flex items-center gap-2.5 pt-2">
                      <button type="button" onClick={() => { playGameSound('move', soundEnabled, soundVolume); setShowSettingsModal(false); }} className="flex-1 bg-gradient-to-b from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-amber-950 font-fredoka font-black text-sm py-3 px-4 rounded-xl shadow-md transition-all cursor-pointer">{t.applyPlayBtn}</button>
                      <button type="button" onClick={handleResetSettings} className="bg-[#2a2d35] hover:bg-[#343842] text-gray-300 font-bold text-xs py-3 px-4 rounded-xl border border-[#424652] transition-colors cursor-pointer">{t.resetBtn}</button>
                    </div>
                  </div>
                </div>
                <div className="md:col-span-6 flex flex-col justify-between bg-[#1d1f24]">
                  <div>
                    <div className="flex items-center justify-between pl-6 pr-0 py-0 border-b border-[#343741]">
                      <div className="flex items-center gap-2 py-4"><span className="text-gray-300 text-base">⚙️</span><h3 className="font-fredoka font-bold text-lg text-white">{t.settingsHeader}</h3></div>
                      <button type="button" onClick={() => setShowSettingsModal(false)} className="bg-red-600 hover:bg-red-500 text-white font-bold w-12 h-12 flex items-center justify-center text-lg transition-colors cursor-pointer self-stretch">✕</button>
                    </div>
                    <div className="px-6 py-2 divide-y divide-[#2e313a]">
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.soundsTitle}</div><div className="text-[11px] text-gray-400">{t.soundsDesc}</div></div>
                        <button type="button" onClick={() => { const next = !soundEnabled; setSoundEnabled(next); if (next) playGameSound('move', true, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${soundEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.hapticsTitle}</div><div className="text-[11px] text-gray-400">{t.hapticsDesc}</div></div>
                        <button type="button" onClick={() => { const next = !hapticsEnabled; setHapticsEnabled(next); if (next) triggerHaptic(true, 30); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${hapticsEnabled ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.showTimerTitle}</div><div className="text-[11px] text-gray-400">{t.showTimerDesc}</div></div>
                        <button type="button" onClick={() => { setShowTimerUI(!showTimerUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showTimerUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.showMovesTitle}</div><div className="text-[11px] text-gray-400">{t.showMovesDesc}</div></div>
                        <button type="button" onClick={() => { setShowMovesUI(!showMovesUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${showMovesUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                      <div className="py-3 flex items-center justify-between gap-3">
                        <div><div className="font-bold text-sm text-white leading-tight">{t.rotateBoardTitle}</div><div className="text-[11px] text-gray-400">{t.rotateBoardDesc}</div></div>
                        <button type="button" onClick={() => { setRotateBoardUI(!rotateBoardUI); playGameSound('select', soundEnabled, soundVolume); }} className={`w-11 h-6 rounded-full transition-colors p-0.5 flex items-center cursor-pointer ${rotateBoardUI ? 'bg-emerald-500 justify-end' : 'bg-gray-600 justify-start'}`}><span className="w-5 h-5 rounded-full bg-white shadow-md block"></span></button>
                      </div>
                    </div>
                  </div>
                  <div className="px-6 py-3 border-t border-[#2e313a] text-center text-[11px] text-gray-400 font-medium">{t.autoSavedFooter}</div>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================================================
              🎬 VICTORY MODAL ("PUZZLE SOLVED") OTIMIZADO PARA TIKTOK / REELS / SHORTS
              - Fonte da descrição ampliada (text-lg sm:text-xl font-bold).
              - Sem caixa de estatísticas (Timer / Stars / Challenge).
              - Sem botão "Review Final Board".
              - Botão verde com "Scroll to another challenge".
             ========================================================================== */}
          {isWon && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="relative w-full max-w-md wood-texture rounded-3xl p-6 sm:p-8 border-4 border-amber-500 shadow-2xl text-center transform transition-all">
                <div className="w-20 h-20 mx-auto -mt-14 mb-3 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-3xl border-4 border-[#3a1a05] shadow-chunky-btn-amber flex items-center justify-center text-4xl">👑</div>
                <span className="inline-block bg-amber-400/20 text-amber-300 border border-amber-400/40 text-xs font-extrabold uppercase px-3 py-1 rounded-full tracking-widest mb-2">{t.puzzleSolvedBadge}</span>
                <h2 className="font-fredoka text-3xl sm:text-4xl font-black text-amber-100 drop-shadow-md">{t.victoryTitle}</h2>
                
                {/* Frase promocional com fonte ampliada */}
                <p className="text-amber-100 text-lg sm:text-xl mt-4 mb-6 font-bold leading-snug drop-shadow">
                  {t.victoryDesc}
                </p>

                <div className="mt-2">
                  <button onClick={handleAnotherChallengeSPA} className="btn-chunky btn-chunky-green w-full bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-fredoka font-black text-lg sm:text-xl py-4 px-6 rounded-2xl border-3 border-emerald-950 shadow-chunky-btn-green flex items-center justify-center gap-3 cursor-pointer">
                    <span>{t.anotherChallengeBtn}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MERCH MODAL */}
          {showMerchModal && (
            <div onClick={() => setShowMerchModal(false)} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className="relative w-full max-w-lg wood-texture rounded-3xl p-6 sm:p-7 border-4 border-amber-600 shadow-2xl text-amber-50 cursor-default">
                <button onClick={() => setShowMerchModal(false)} className="absolute top-4 right-4 text-amber-300 hover:text-white bg-amber-950/60 p-2 rounded-xl border border-amber-700/60">✕</button>
                <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-2xl">📦</div><div><h3 className="font-fredoka text-2xl font-bold text-amber-100">{t.merchModalTitle}</h3><p className="text-xs text-amber-300/80 font-medium">{t.merchModalSubtitle}</p></div></div>
                <div className="bg-[#1f0e04] border-2 border-amber-800 rounded-2xl p-4 mb-4 flex items-center gap-4">
                  <div className="w-24 h-24 rounded-xl bg-amber-950 border border-amber-700/80 flex items-center justify-center text-4xl shadow-inner">♟️🪵</div>
                  <div className="flex-1 text-xs space-y-1"><div className="font-bold text-amber-200 text-sm">{t.merchItemTitle}</div><div className="text-amber-400/90">{t.merchBullet1}</div><div className="text-amber-400/90">{t.merchBullet2}</div><div className="text-emerald-400 font-extrabold text-lg mt-1">$29.99 <span className="text-amber-300/60 line-through text-xs font-normal">$39.99</span></div></div>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => { alert(t.checkoutAlert); setShowMerchModal(false); }} className="btn-chunky btn-chunky-amber flex-1 bg-gradient-to-b from-amber-500 to-amber-600 hover:from-amber-400 text-amber-950 font-fredoka font-black text-lg py-3 rounded-2xl border-2 border-amber-950 shadow-chunky-btn-amber">{t.preOrderBtn}</button>
                  <button onClick={() => setShowMerchModal(false)} className="px-4 py-3 bg-[#2f1608] hover:bg-[#3d1e0b] rounded-2xl font-bold text-xs text-amber-200 border border-amber-800">{t.closeBtn}</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Bloqueio do Menu de Contexto (Botão Direito) -->
<script>document.addEventListener('contextmenu', event => event.preventDefault());</script>
</body>
</html>
